<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clock</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  cursor: none;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* video wallpaper — covers full screen, letterbox/crop to fill */
#wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* dark vignette overlay so clock stays readable */
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.52);
  z-index: 1;
}

/* clock UI above video */
.ui {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.clock {
  display: flex;
  align-items: center;
  gap: 16px;
}

.pair { display: flex; gap: 10px; }

.digit {
  position: relative;
  width: 160px;
  height: 200px;
  border-radius: 10px;
  perspective: 600px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.6);
}

.back-top {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 50%;
  background: rgba(20, 20, 20, 0.88);
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  z-index: 1;
  backdrop-filter: blur(4px);
}

.front-top {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 50%;
  background: rgba(26, 26, 26, 0.9);
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  z-index: 3;
  transform-origin: center bottom;
  backdrop-filter: blur(4px);
}
.front-top.flip {
  animation: flipTop 0.38s ease-in forwards;
}
@keyframes flipTop {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}

.back-bot {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 50%;
  background: rgba(16, 16, 16, 0.9);
  border-radius: 0 0 10px 10px;
  overflow: hidden;
  z-index: 4;
  border-top: 2px solid rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
}

.num {
  position: absolute;
  left: 0; right: 0;
  font-size: 176px;
  font-weight: 700;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  text-align: center;
  line-height: 200px;
  white-space: nowrap;
}
.back-top .num,
.front-top .num { top: 0;    color: #eeebe5; }
.back-bot  .num { bottom: 0; color: #b0aca6; }

.colon {
  font-size: 130px;
  font-weight: 700;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: rgba(255,255,255,0.25);
  line-height: 200px;
  animation: blinkcolon 1s steps(1) infinite;
  align-self: center;
  margin-bottom: 4px;
}
@keyframes blinkcolon {
  0%, 100% { opacity: 1;   }
  50%       { opacity: 0.1; }
}

.date {
  margin-top: 32px;
  font-size: 17px;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 300;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<video id="wallpaper" autoplay loop muted playsinline>
  <source src="wallpaper.mp4" type="video/mp4">
</video>

<div id="overlay"></div>

<div class="ui">
  <div class="clock">
    <div class="pair">
      <div class="digit" id="d0">
        <div class="back-top"><div class="num">0</div></div>
        <div class="front-top"><div class="num">0</div></div>
        <div class="back-bot"><div class="num">0</div></div>
      </div>
      <div class="digit" id="d1">
        <div class="back-top"><div class="num">0</div></div>
        <div class="front-top"><div class="num">0</div></div>
        <div class="back-bot"><div class="num">0</div></div>
      </div>
    </div>

    <div class="colon">:</div>

    <div class="pair">
      <div class="digit" id="d2">
        <div class="back-top"><div class="num">0</div></div>
        <div class="front-top"><div class="num">0</div></div>
        <div class="back-bot"><div class="num">0</div></div>
      </div>
      <div class="digit" id="d3">
        <div class="back-top"><div class="num">0</div></div>
        <div class="front-top"><div class="num">0</div></div>
        <div class="back-bot"><div class="num">0</div></div>
      </div>
    </div>
  </div>

  <div class="date" id="date-str"></div>
</div>

<script>
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

let cur = [-1, -1, -1, -1];

function setAll(el, n) {
  el.querySelectorAll('.num').forEach(x => x.textContent = n);
}

function flipTo(el, from, to) {
  const backTopNum = el.querySelector('.back-top .num');
  const frontTop   = el.querySelector('.front-top');
  const backBotNum = el.querySelector('.back-bot .num');

  backTopNum.textContent = to;

  frontTop.classList.remove('flip');
  void frontTop.offsetWidth;
  frontTop.classList.add('flip');

  setTimeout(() => {
    frontTop.classList.remove('flip');
    frontTop.querySelector('.num').textContent = to;
    backBotNum.textContent = to;
  }, 400);
}

function tick() {
  const now  = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const vals = [Math.floor(h / 10), h % 10, Math.floor(m / 10), m % 10];

  ['d0','d1','d2','d3'].forEach((id, i) => {
    if (cur[i] === vals[i]) return;
    const el = document.getElementById(id);
    if (cur[i] === -1) setAll(el, vals[i]);
    else flipTo(el, cur[i], vals[i]);
    cur[i] = vals[i];
  });

  document.getElementById('date-str').textContent =
    `${DAYS[now.getDay()]}  ·  ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

tick();
setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - new Date().getMilliseconds());
</script>
</body>
</html>
